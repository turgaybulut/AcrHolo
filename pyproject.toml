[project]
name = "acrholo"
version = "0.1.0"
description = "Homolog-conditioned protein representations for anti-CRISPR classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fair-esm==2.0.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "torch==2.14.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["ruff", "ty"]

[project.scripts]
acrholo = "acrholo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acrholo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
